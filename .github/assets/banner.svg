  </style>
  <rect width="1280" height="300" rx="18" fill="#0f0d14"/>
  <rect width="1280" height="300" rx="18" fill="url(#glow)"/>
  <text x="84" y="156" class="title">Gen_AI_DP3HYC</text>
  <path class="swash" d="M88 184 C 292 182, 514 176, 777 173"/>
  <text x="86" y="232" class="tagline">Two generative models learn to paint flowers.</text>
  <text x="1136" y="104" class="tag" text-anchor="middle">DCGAN</text>
  <text x="1136" y="156" class="tag" text-anchor="middle">VAE</text>
